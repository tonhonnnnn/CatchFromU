<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="appleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0071E3" />
      <stop offset="50%" stop-color="#4796FB" />
      <stop offset="100%" stop-color="#8040FA" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0071E3" flood-opacity="0.3"/>
    </filter>
  </defs>
  <!-- Squircle Background -->
  <rect x="5" y="5" width="90" height="90" rx="24" fill="url(#appleGrad)" filter="url(#shadow)" />
  
  <!-- Subtle inner border -->
  <rect x="5.5" y="5.5" width="89" height="89" rx="23.5" fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="1" />
  
  <!-- Catch / Download Arrow with Wave -->
  <path d="M50 28 V60 M36 46 L50 60 L64 46" fill="none" stroke="#FFFFFF" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M30 68 C40 76 60 76 70 68" fill="none" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" />
</svg>
